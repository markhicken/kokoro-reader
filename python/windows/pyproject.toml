[project]
name = "kokoro-windows-sidecar"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "espeakng-loader==0.2.4",
    "kokoro==0.9.4",
    "misaki[en]~=0.9.4",
    "numpy>=1.26,<3",
    "torch>=2.8,<3",
    "transformers>=4.48,<5",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[tool.uv]
environments = ["sys_platform == 'win32' and (platform_machine == 'AMD64' or platform_machine == 'ARM64')"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
