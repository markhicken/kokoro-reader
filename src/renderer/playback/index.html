<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'" />
    <title>Kokoro Reader — Playback controls</title>
    <link rel="stylesheet" href="../overlay.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="overlay-surface" aria-label="Playback controls">
      <span class="handle" aria-hidden="true"></span>
      <button type="button" class="skip" id="rewind" title="Back 10 seconds" aria-label="Back 10 seconds">↶<small>10</small></button>
      <button type="button" class="primary" id="toggle" title="Pause" aria-label="Pause">⏸︎</button>
      <button type="button" class="skip" id="forward" title="Forward 10 seconds" aria-label="Forward 10 seconds">↷<small>10</small></button>
      <button type="button" id="stop" title="Stop" aria-label="Stop">■</button>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
