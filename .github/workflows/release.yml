name: Release

on:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest # arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: astral-sh/setup-uv@v5

      - name: Compute version
        id: version
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          echo "version=${base}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: Set package version
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version

      # gh publishes the release; stop electron-builder auto-publishing on CI
      - run: npm run dist -- --publish never

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" dist/*.dmg \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes \
            --target "$GITHUB_SHA"
