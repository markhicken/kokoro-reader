name: Validate desktop builds

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v5
      - run: npm ci
      - run: npm run typecheck
      - run: npm run dist -- --publish never
      - run: node scripts/check-package.mjs
      - run: node scripts/smoke-engine.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-dmg
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v5
      - run: npm ci
      - run: npm run typecheck
      - run: npm run dist -- --publish never
      - run: node scripts/check-package.mjs
      - run: node scripts/smoke-engine.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-installer
          path: dist/*-setup.exe
          if-no-files-found: error
